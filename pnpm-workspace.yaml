# Supply-chain safeguard: refuse package versions published less than 3 days
# (4320 minutes) ago, giving time for malicious releases to be caught.
minimumReleaseAge: 4320
# First-party packages we publish ourselves
minimumReleaseAgeExclude:
  - "@kontent-ai/*"
# archiver@8.0.0 (latest) still depends on readdir-glob@^3, which pins minimatch@^10 (CVE-2026-118764).
overrides:
  "readdir-glob>minimatch": ^11.0.1
